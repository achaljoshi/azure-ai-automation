# PR build validation + CI on main. Agent PRs get extra policy checks.
trigger:
  branches: { include: [ main ] }
pr:
  branches: { include: [ main ] }

pool: { vmImage: ubuntu-latest }

stages:
- stage: build
  jobs:
  - job: build_test
    steps:
    - checkout: self
      fetchDepth: 0
    - template: templates/build-and-unit-test.yml
    - template: templates/agent-pr-policy.yml
    - task: PublishTestResults@2
      condition: always()
      inputs: { testResultsFormat: JUnit, testResultsFiles: '**/junit*.xml' }
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
