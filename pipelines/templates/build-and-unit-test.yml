# Build + unit tests for the TARGET project, driven by its adapter (.agent/project.json) — no per-project YAML edits.
# Expects the agent kit checked out next to the target repo (see dev-agent.yml): $(Pipeline.Workspace)/s/agentkit
parameters:
- name: workingDirectory
  type: string
  default: $(Pipeline.Workspace)/s/target
steps:
- bash: |
    set -euo pipefail
    KIT="$(Pipeline.Workspace)/s/agentkit"
    pip install -q pyyaml >/dev/null 2>&1 || true
    eval "$(python "$KIT/scripts/adapter_cmd.py" install)"
    eval "$(python "$KIT/scripts/adapter_cmd.py" build)"
    eval "$(python "$KIT/scripts/adapter_cmd.py" unit_test)"
  displayName: Install, build, unit tests (from adapter)
  workingDirectory: ${{ parameters.workingDirectory }}
