# Extra checks when the PR source branch is ai/* (created by the Development agent). Same code as the local loop's gate.
steps:
- bash: |
    set -euo pipefail
    BASE=origin/$(echo "$(System.PullRequest.TargetBranch)" | sed 's#refs/heads/##')
    python "$(Pipeline.Workspace)/s/agentkit/scripts/check_agent_diff.py" --base "$BASE"
  displayName: Agent PR policy (ai/* branches)
  workingDirectory: $(Pipeline.Workspace)/s/target
  condition: and(eq(variables['Build.Reason'], 'PullRequest'), startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/ai/'))
