# QA agent run against the test environment. Queued by deploy-test.yml per linked work item.
# The agent designs and writes tests; THIS PIPELINE runs the suites itself and decides from real results.
trigger: none
pr: none
parameters:
- name: workItemId
  type: string

resources:
  repositories:
  - repository: agentkit
    type: git
    name: ai-agentkit

pool: { vmImage: ubuntu-latest }
variables:
- group: ai-agents              # FOUNDRY_ENDPOINT, PRIMARY_DEPLOYMENT, ORCHESTRATOR_URL, TEST_BASE_URL, LLM_PROVIDER
- name: KIT
  value: $(Pipeline.Workspace)/s/agentkit
- name: TARGET
  value: $(Pipeline.Workspace)/s/target

jobs:
- job: qa_agent
  timeoutInMinutes: 90
  steps:
  - checkout: self
    path: s/target
  - checkout: agentkit
    path: s/agentkit
  - task: NodeTool@0
    inputs: { versionSpec: '20.x' }
  - bash: |
      pip install -q -r "$(KIT)/orchestrator/requirements.txt"
      eval "$(python "$(KIT)/scripts/adapter_cmd.py" install)"
      npx --yes playwright install --with-deps chromium || true
    displayName: Install agent kit + test tooling
    workingDirectory: $(TARGET)
  - task: AzureCLI@2
    displayName: Build QA context
    inputs:
      azureSubscription: 'sc-ai-sdlc-poc'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(TARGET)
      inlineScript: python "$(KIT)/scripts/build_context.py" --work-item ${{ parameters.workItemId }} --role qa --base-url "$(TEST_BASE_URL)"
  - task: AzureCLI@2
    displayName: Run QA agent (design + generate tests)
    inputs:
      azureSubscription: 'sc-ai-sdlc-poc'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(TARGET)
      inlineScript: python "$(KIT)/agents/runner.py" --role qa --work-item ${{ parameters.workItemId }} --context context.json
  - bash: |
      eval "$(python "$(KIT)/scripts/adapter_cmd.py" unit_test)" || echo "##vso[task.logissue type=warning]unit tests failed"
      eval "$(python "$(KIT)/scripts/adapter_cmd.py" e2e_test)" || echo "##vso[task.logissue type=error]e2e tests failed"
    displayName: Regression + generated tests (trusted run)
    workingDirectory: $(TARGET)
    env: { BASE_URL: $(TEST_BASE_URL), PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit-qa.xml }
    continueOnError: true
  - script: |
      docker run --rm -v $(pwd):/zap/wrk -t ghcr.io/zaproxy/zaproxy:stable \
        zap-baseline.py -t $(TEST_BASE_URL) -J zap.json -r zap.html || true
    displayName: Security baseline (OWASP ZAP)
    workingDirectory: $(TARGET)
  - task: AzureCLI@2
    displayName: File bugs + post verdict to Orchestrator
    inputs:
      azureSubscription: 'sc-ai-sdlc-poc'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(TARGET)
      inlineScript: |
        python "$(KIT)/scripts/post_qa_results.py" --work-item ${{ parameters.workItemId }} \
          --result agent-result.json --orchestrator "$(ORCHESTRATOR_URL)"
  - task: PublishTestResults@2
    condition: always()
    inputs: { testResultsFormat: JUnit, testResultsFiles: '$(TARGET)/**/junit*.xml' }
  - publish: $(TARGET)/playwright-report
    artifact: playwright-report-$(System.JobAttempt)
    condition: always()
  - publish: $(TARGET)/agent-transcript.jsonl
    artifact: qa-transcript-$(System.JobAttempt)
    condition: always()
