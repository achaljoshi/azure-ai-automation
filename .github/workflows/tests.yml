name: tests
on:
  pull_request:
  push:
    branches: ['**']
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.12' }
    - run: pip install pytest pyyaml requests openai anthropic azure-identity azure-functions
    - run: python -m pytest -q
    - run: python scripts/demo_local.py          # the offline end-to-end loop must keep working
